name: ImportVerifier release check

on:
  pull_request:
  push:
    branches:
      # Keep direct push validation only for the legacy release-prep branch.
      # The active ImportVerifier branch is already validated by pull_request,
      # avoiding two identical full npm/test/typecheck/build runs per commit.
      - feat/importverifier-release-prep-final3

concurrency:
  group: importverifier-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin immutable release commits to reduce third-party action supply-chain drift.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://importverifier.netlify.app
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
