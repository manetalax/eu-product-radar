name: Build Wallabid APK Fast
on:
  push:
    branches: [wallabid-apk-fast]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unpack Wallabid source
        run: |
          rm -rf wallabid-build
          mkdir -p wallabid-build
          unzip -o wallabid-actions-source.zip -d wallabid-build
      - name: Install dependencies
        working-directory: wallabid-build
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm install expo-linking@~57.0.8 --legacy-peer-deps --no-audit --no-fund
      - name: Typecheck
        working-directory: wallabid-build
        run: npm run typecheck
      - name: Generate native Android project
        working-directory: wallabid-build
        run: npx expo prebuild --platform android --no-install
      - name: Build ARM64 release APK
        working-directory: wallabid-build/android
        env:
          NODE_ENV: production
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Collect APK
        run: |
          mkdir -p out
          cp wallabid-build/android/app/build/outputs/apk/release/*.apk out/Wallabid.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Wallabid-APK-ARM64
          path: out/Wallabid.apk
          if-no-files-found: error
