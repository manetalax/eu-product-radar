name: ImportVerifier regulatory radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  refresh-eurlex:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh official EUR-Lex radar
        env:
          SITE_ORIGIN: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          REGULATORY_INGEST_SECRET: ${{ secrets.REGULATORY_INGEST_SECRET }}
        run: |
          test -n "$SITE_ORIGIN"
          test -n "$REGULATORY_INGEST_SECRET"
          node -e "const u = new URL(process.env.SITE_ORIGIN); if (u.protocol !== 'https:' || u.username || u.password || u.search || u.hash || (u.pathname !== '/' && u.pathname !== '')) process.exit(1)"
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $REGULATORY_INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "${SITE_ORIGIN%/}/api/internal/regulatory-refresh"
