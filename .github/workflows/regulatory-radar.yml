name: ImportVerifier regulatory radar

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: read

jobs:
  refresh-eurlex:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refresh official EUR-Lex radar
        env:
          SITE_ORIGIN: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          REGULATORY_INGEST_SECRET: ${{ secrets.REGULATORY_INGEST_SECRET }}
        run: |
          if [ -z "$SITE_ORIGIN" ]; then
            echo "::error title=Radar configuration missing::Add the repository variable NEXT_PUBLIC_SITE_URL with the canonical HTTPS production origin."
            exit 1
          fi
          if [ -z "$REGULATORY_INGEST_SECRET" ]; then
            echo "::error title=Radar configuration missing::Add the REGULATORY_INGEST_SECRET Actions secret and the matching server environment variable in Sites."
            exit 1
          fi
          if [ "${#REGULATORY_INGEST_SECRET}" -lt 32 ]; then
            echo "::error title=Radar configuration invalid::REGULATORY_INGEST_SECRET must contain at least 32 characters."
            exit 1
          fi
          if ! node -e "try { const u = new URL(process.env.SITE_ORIGIN); if (u.protocol !== 'https:' || u.username || u.password || u.search || u.hash || (u.pathname !== '/' && u.pathname !== '')) process.exit(1); } catch { process.exit(1); }"; then
            echo "::error title=Radar configuration invalid::NEXT_PUBLIC_SITE_URL must be an HTTPS origin without credentials, path, query, or fragment."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 60 \
            -X POST \
            -H "Authorization: Bearer $REGULATORY_INGEST_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}' \
            "${SITE_ORIGIN%/}/api/internal/regulatory-refresh"
